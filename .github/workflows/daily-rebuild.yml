# Rebuilds the site every morning so "Playing today" and the hero stay current.
# Needs a Cloudflare Pages deploy hook saved as the repository secret CF_DEPLOY_HOOK
# (Cloudflare Pages → project → Settings → Builds → Deploy hooks).
name: Daily rebuild

on:
  schedule:
    - cron: '7 17 * * *' # 00:07 WIB
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages build
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "CF_DEPLOY_HOOK is not set yet; skipping."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
